name: aegis_auth
description: Aegis Auth Flutter SDK - Unified identity management system providing secure authentication for Flutter applications.
version: 1.0.0
homepage: https://github.com/navchetnaofficialllp/aegis-auth-sdk-flutter
repository: https://github.com/navchetnaofficialllp/aegis-auth-sdk-flutter
documentation: https://aegis.navchetna.tech
publisher: navchetna.tech

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.2
  crypto: ^3.0.3
  local_auth: ^2.1.6
  webauthn: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.navchetna.aegis_auth
        pluginClass: AegisAuthPlugin
      ios:
        pluginClass: AegisAuthPlugin

topics:
  - authentication
  - auth
  - webauthn
  - mfa
  - jwt
  - biometric
  - oauth
  - sso